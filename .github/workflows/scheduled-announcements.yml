name: Scheduled Announcement Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Send due announcement alerts
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://app.delmarjiujitsuclub.com/api/cron/announcements
